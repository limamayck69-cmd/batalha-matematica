<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Batalha Matemática</title>
<style>
:root{--bg:#071426;--card:#10243d;--cyan:#35d6e8;--purple:#8b70ff;--text:#f4f7ff;--muted:#a9bad0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173b62,#071426 65%);color:var(--text);font-family:system-ui,Arial,sans-serif;padding:20px}
main{max-width:850px;margin:auto}.brand{text-align:center;margin:12px 0 24px}.brand h1{font-size:clamp(2rem,7vw,3.4rem);margin:0;color:var(--cyan);text-shadow:0 0 24px #35d6e855}.brand p{color:var(--muted)}
.card{background:#10243deF;border:1px solid #355474;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 15px 40px #0005}
h2{margin-top:0}input{width:100%;padding:14px;border-radius:12px;border:1px solid #55718f;background:#07182b;color:white;font-size:1rem;margin:8px 0 14px}
button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:1rem;cursor:pointer;background:linear-gradient(100deg,var(--cyan),#8bf2d7);color:#071426;margin:5px}
button.alt{background:linear-gradient(100deg,#967cff,#c1a5ff)}button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.pin{font-size:2.4rem;letter-spacing:8px;color:var(--cyan);font-weight:900;text-align:center}
.player{padding:10px;background:#183453;border-radius:10px;margin:7px 0;display:flex;justify-content:space-between;gap:8px}
.question{font-size:1.35rem;font-weight:800;line-height:1.4}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.answers button{min-height:66px;background:#244768;color:white;border:1px solid #52799b}.answers button:disabled{opacity:.65}
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);flex-wrap:wrap}.notice{color:#ffd27a;min-height:24px}.good{color:#82f0b5}.bad{color:#ff9b9b}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin:25px}
@media(max-width:520px){body{padding:12px}.card{padding:17px}.answers{grid-template-columns:1fr}.pin{font-size:2rem}}
</style>
</head>
<body><main>
<header class="brand"><h1>⚡ BATALHA MATEMÁTICA</h1><p>Entre com um PIN e desafie seus amigos!</p></header>
<section id="home" class="card">
<h2>🎮 Entrar na batalha</h2>
<label>Seu nome</label><input id="playerName" maxlength="18" placeholder="Digite seu nome">
<div class="actions"><button id="createBtn">Criar sala</button></div>
<hr style="border-color:#355474;margin:20px 0">
<label>PIN da sala</label><input id="pinInput" inputmode="numeric" maxlength="6" placeholder="Ex.: 482193">
<button class="alt" id="joinBtn">Entrar com PIN</button>
<p class="notice" id="homeMsg"></p>
</section>
<section id="lobby" class="card hidden">
<h2>🏆 Sala de espera</h2><p>Compartilhe este PIN com seus amigos:</p><div class="pin" id="roomPin"></div>
<p id="lobbyCount"></p><div id="lobbyPlayers"></div>
<div class="actions"><button id="startBtn">Começar partida</button><button class="alt" id="leaveBtn">Sair da sala</button></div>
<p class="notice" id="lobbyMsg">Aguardando o anfitrião iniciar...</p>
</section>
<section id="game" class="card hidden">
<div class="meta"><span id="roundInfo">Pergunta 1</span><span>⏱ <b id="timer">20</b>s</span></div>
<div style="height:9px;background:#29425c;border-radius:9px;margin:12px 0 20px"><div id="timeBar" style="height:100%;width:100%;background:var(--cyan);border-radius:9px"></div></div>
<div class="question" id="questionText"></div><div class="answers" id="answerButtons"></div>
<p class="notice" id="gameMsg"></p><h3>📊 Placar</h3><div id="gamePlayers"></div>
<button id="nextBtn" class="hidden">Próxima pergunta</button>
</section>
<section id="result" class="card hidden"><h2>🏅 Resultado final</h2><div id="finalRanking"></div><button onclick="location.reload()">Voltar ao início</button></section>
<footer>Protótipo educacional • Batalha Matemática</footer>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyAakf_54XSCQijFp4bjDXiiFwV6PSZwJfQ",
 authDomain:"batalhamatematica-16322.firebaseapp.com",
 databaseURL:"https://batalhamatematica-16322-default-rtdb.firebaseio.com",
 projectId:"batalhamatematica-16322",
 storageBucket:"batalhamatematica-16322.firebasestorage.app",
 messagingSenderId:"48762205432",
 appId:"1:48762205432:web:141f27085374d67892b70d"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.database();
const $=id=>document.getElementById(id);
const questions=[
{q:"Qual é o limite de x + 2 quando x tende a 3?",a:["3","5","6","2"],c:1},
{q:"Qual é a derivada de f(x) = x²?",a:["x","2x","x²","2"],c:1},
{q:"Quanto vale lim (2x + 1), quando x → 2?",a:["3","4","5","6"],c:2},
{q:"Qual é a derivada de f(x) = 5x?",a:["5","x","5x","0"],c:0},
{q:"Qual é a derivada de uma constante?",a:["1","A própria constante","0","x"],c:2},
{q:"Quanto vale 3² + 1?",a:["7","9","10","12"],c:2},
{q:"A derivada de x³ é:",a:["3x²","x²","3x","x⁴"],c:0},
{q:"Qual é o limite de x² quando x → 4?",a:["8","12","16","4"],c:2},
{q:"A inclinação da reta y = 2x + 3 é:",a:["3","2","5","1"],c:1},
{q:"A derivada de f(x) = x é:",a:["0","x","1","2x"],c:2}
];
let uid=null,room=null,pin=null,isHost=false,unsub=null,localTimer=null,remaining=20,answered=false,roomData=null;
function show(id){["home","lobby","game","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function msg(id,t,cls=""){ $(id).textContent=t;$(id).className="notice "+cls}
function cleanName(){return $("playerName").value.trim().slice(0,18)}
function randomPin(){return String(Math.floor(100000+Math.random()*900000))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
async function ensureAuth(){if(!auth.currentUser)await auth.signInAnonymously();uid=auth.currentUser.uid}
function roomRef(){return db.ref("salas/"+pin)}
async function createRoom(){
 const name=cleanName();if(!name){msg("homeMsg","Digite seu nome primeiro.");return}
 try{await ensureAuth();let p=randomPin();let ref=db.ref("salas/"+p);
 await ref.set({host:uid,status:"lobby",createdAt:Date.now(),players:{[uid]:{name,score:0,streak:0}},deck:shuffle(questions).map((q)=>q),index:0,deadline:0});
 pin=p;isHost=true;enterRoom();}catch(e){msg("homeMsg","Não foi possível criar: "+e.message)}
}
async function joinRoom(){
 const name=cleanName(),p=$("pinInput").value.trim();if(!name){msg("homeMsg","Digite seu nome primeiro.");return}
 if(!/^\d{6}$/.test(p)){msg("homeMsg","Digite um PIN de 6 números.");return}
 try{await ensureAuth();pin=p;const ref=roomRef();let joined=false;
 await ref.child("players").transaction(players=>{players=players||{};if(players[uid]){joined=true;return players}if(Object.keys(players).length>=10)return;players[uid]={name,score:0,streak:0};joined=true;return players;});
 const snap=await ref.get();if(!snap.exists()){msg("homeMsg","Sala não encontrada.");return}
 if(!joined){msg("homeMsg","A sala já tem 10 jogadores.");return}
 isHost=snap.val().host===uid;enterRoom();
 }catch(e){msg("homeMsg","Erro ao entrar: "+e.message)}
}
function enterRoom(){show("lobby");$("roomPin").textContent=pin;subscribe();if(isHost)$("startBtn").classList.remove("hidden");else $("startBtn").classList.add("hidden")}
function subscribe(){
 if(unsub)unsub();const ref=roomRef();const handler=s=>{if(!s.exists()){msg("lobbyMsg","A sala foi encerrada.");return}roomData=s.val();renderPlayers();if(roomData.status==="playing"&&$("game").classList.contains("hidden")){show("game");renderQuestion()}else if(roomData.status==="playing"){renderQuestion()}else if(roomData.status==="finished"){renderFinal()}};
 ref.on("value",handler);unsub=()=>ref.off("value",handler);
}
function renderPlayers(){
 const players=Object.entries(roomData.players||{}).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
 $("lobbyCount").textContent=players.length+"/10 jogadores";
 $("lobbyPlayers").innerHTML=players.map(([id,p],i)=>`<div class="player"><span>${i+1}. ${esc(p.name)} ${id===roomData.host?"👑":""}</span><b>${p.score||0} pts</b></div>`).join("");
 $("gamePlayers").innerHTML=players.map(([id,p],i)=>`<div class="player"><span>${i+1}. ${esc(p.name)}</span><b>${p.score||0} pts</b></div>`).join("");
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function startGame(){const deck=shuffle(questions);await roomRef().update({status:"playing",deck,index:0,deadline:Date.now()+20000});}
function renderQuestion(){
 if(!roomData||roomData.status!=="playing")return;const idx=roomData.index||0,q=(roomData.deck||questions)[idx];
 if(!q){if(isHost)roomRef().update({status:"finished"});return}
 $("roundInfo").textContent=`Pergunta ${idx+1} de ${roomData.deck.length}`;
 $("questionText").textContent=q.q;
 $("answerButtons").innerHTML=q.a.map((a,i)=>`<button data-i="${i}" ${roomData.players[uid]?.answers?.[idx]!==undefined?"disabled":""}>${esc(a)}</button>`).join("");
 [...$("answerButtons").querySelectorAll("button")].forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));
 answered=roomData.players[uid]?.answers?.[idx]!==undefined;
 if(answered)msg("gameMsg","Resposta registrada! Aguarde a próxima pergunta.","good");else msg("gameMsg","Escolha uma alternativa.");
 startTimer(roomData.deadline||Date.now()+20000);renderPlayers();
 if(isHost)$("nextBtn").classList.remove("hidden");else $("nextBtn").classList.add("hidden");
}
function startTimer(deadline){clearInterval(localTimer);function tick(){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));$("timer").textContent=remaining;$("timeBar").style.width=(remaining/20*100)+"%";if(remaining<=0){clearInterval(localTimer);if(isHost)advance();}}tick();localTimer=setInterval(tick,250)}
async function answer(i){
 if(answered)return;answered=true;[...$("answerButtons").querySelectorAll("button")].forEach(b=>b.disabled=true);
 const idx=roomData.index,q=roomData.deck[idx],correct=i===q.c;
 const updates={};updates[`players/${uid}/answers/${idx}`]=i;
 if(correct){const p=roomData.players[uid]||{};const streak=(p.streak||0)+1;updates[`players/${uid}/score`]=(p.score||0)+10+(streak%3===0?5:0);updates[`players/${uid}/streak`]=streak;}
 else updates[`players/${uid}/streak`]=0;
 try{await roomRef().update(updates);msg("gameMsg",correct?"Resposta correta! + pontos":"Resposta registrada. Boa sorte na próxima!",correct?"good":"");}catch(e){msg("gameMsg","Erro ao enviar resposta: "+e.message)}
}
async function advance(){if(!isHost)return;const next=(roomData.index||0)+1;if(next>=roomData.deck.length){await roomRef().update({status:"finished"});return}await roomRef().update({index:next,deadline:Date.now()+20000});}
function renderFinal(){clearInterval(localTimer);show("result");const players=Object.values(roomData.players||{}).sort((a,b)=>(b.score||0)-(a.score||0));$("finalRanking").innerHTML=players.map((p,i)=>`<div class="player"><span>${["🥇","🥈","🥉"][i]||`${i+1}.`} ${esc(p.name)}</span><b>${p.score||0} pts</b></div>`).join("")}
async function leave(){clearInterval(localTimer);if(pin&&uid){try{await roomRef().child("players/"+uid).remove()}catch(e){}}if(unsub)unsub();location.reload()}
$("createBtn").onclick=createRoom;$("joinBtn").onclick=joinRoom;$("startBtn").onclick=startGame;$("nextBtn").onclick=advance;$("leaveBtn").onclick=leave;
</script></body></html>
